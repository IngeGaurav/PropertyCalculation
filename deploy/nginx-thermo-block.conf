# Thermo Property API - add this server block INSIDE the existing  http { ... }  of C:\nginx\conf\nginx.conf
# (for example right after the last "server { ... }" block). Do not replace the whole nginx.conf.
# Assumes the project is in C:\thermo-api. Always use forward slashes in nginx paths on Windows.
# Port 4300 was chosen because it is not used by the other sites (4200, 3000). Change it if it is taken.

    server {
        listen       4300;
        server_name  _;

        client_max_body_size  5m;       # request bodies are tiny; this still allows very long component lists

        # ---- the page ----
        root   C:/thermo-api/Frontend;
        index  index.html;

        location / {
            try_files $uri $uri/ =404;
        }

        # ---- the API:  /api/xxx  ->  http://127.0.0.1:8000/xxx ----
        # The trailing slash after 8000 makes nginx remove the /api prefix.
        location /api/ {
            proxy_pass         http://127.0.0.1:8000/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout    60s;   # must be larger than CALC_TIMEOUT_SECONDS (30)
        }

        location = /api {
            return 302 /api/docs;        # convenience: /api opens the interactive docs
        }
    }
