# Replace C:\nginx\conf\nginx.conf with this file (keep a backup of the original).
# Assumes the project lives in C:\thermo-api  -  change the "root" line if you put it elsewhere.
# Always use forward slashes in nginx paths on Windows.

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;

    server {
        listen       80;
        server_name  _;                 # answer for any host name / IP of this computer

        client_max_body_size  5m;       # request bodies are tiny; this still allows very long component lists

        # ---- Frontend (static page) ----
        root   C:/thermo-api/Frontend;
        index  index.html;

        location / {
            try_files $uri $uri/ =404;
        }

        # ---- Backend API:  /api/xxx  ->  http://127.0.0.1:8000/xxx ----
        # The trailing slash after 8000 makes nginx strip the /api prefix.
        location /api/ {
            proxy_pass         http://127.0.0.1:8000/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout    60s;   # must be larger than CALC_TIMEOUT_SECONDS (30)
        }

        location = /api {
            return 302 /api/docs;        # convenience: /api opens the interactive docs
        }
    }
}
